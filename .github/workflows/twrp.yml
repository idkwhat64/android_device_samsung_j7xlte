name: Build TWRP j7xlte

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git-core gnupg flex bison gperf build-essential \
          zip curl zlib1g-dev gcc-multilib g++-multilib \
          libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
          libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
          xsltproc unzip python3 bc ccache libssl-dev

    - name: Repo init
      run: |
        mkdir twrp
        cd twrp
        repo init -u https://github.com/TeamWin/android_bootable_recovery.git -b twrp-12.1

    - name: Repo sync
      run: |
        cd twrp
        repo sync -j4 --force-sync

    - name: Copy device tree
      run: |
        mkdir -p twrp/device/samsung
        cp -r device/samsung/j7xlte twrp/device/samsung/

    - name: Build recovery
      run: |
        cd twrp
        source build/envsetup.sh
        lunch omni_j7xlte-eng
        mka recoveryimage

    - name: Upload recovery
      uses: actions/upload-artifact@v4
      with:
        name: twrp-j7xlte
        path: twrp/out/target/product/j7xlte/recovery.img
