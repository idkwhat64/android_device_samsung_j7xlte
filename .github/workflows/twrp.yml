name: Build TWRP j7xlte

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1️⃣ Checkout your fork
    - name: Checkout repo
      uses: actions/checkout@v4

    # 2️⃣ Install dependencies and repo
    - name: Install repo and packages
      run: |
        sudo apt update
        sudo apt install -y git-core gnupg flex bison gperf build-essential \
          zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
          lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
          libgl1-mesa-dev libxml2-utils xsltproc unzip python3 bc ccache libssl-dev
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo

    # 3️⃣ Initialize shallow repo sync (TWRP 3.7.1)
    - name: Repo init & sync
      run: |
        mkdir twrp
        cd twrp
        ~/bin/repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1
        ~/bin/repo sync -j4 --force-sync --no-tags --optimized-fetch

    # 4️⃣ Copy your device tree + prebuilt kernel/dt
    - name: Copy device tree
      run: |
        mkdir -p twrp/device/samsung
        cp -r device/samsung/j7xlte twrp/device/samsung/

    # 5️⃣ Clean ccache to save space
    - name: Clear ccache
      run: |
        ccache -C

    # 6️⃣ Build TWRP for j7xlte only
    - name: Build recovery
      run: |
        cd twrp
        source build/envsetup.sh
        lunch omni_j7xlte-eng
        mka recoveryimage

    # 7️⃣ Upload artifact
    - name: Upload recovery.img
      uses: actions/upload-artifact@v4
      with:
        name: twrp-j7xlte
        path: twrp/out/target/product/j7xlte/recovery.img
